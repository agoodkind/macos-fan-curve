name: FanCurveApp
options:
  bundleIdPrefix: io.goodkind
  deploymentTarget:
    macOS: "13"
  createIntermediateGroups: true

configFiles:
  Debug: Config/debug.xcconfig
  Release: Config/release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SPARKLE_FEED_URL: ""
    SPARKLE_PUBLIC_ED_KEY: ""

packages:
  FanCurve:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1

targetTemplates:
  CommonConfig:
    preBuildScripts:
      - script: "${SRCROOT}/Scripts/generate-config.sh"
        name: "Generate Config from xcconfig"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/Generated/Config.generated.swift"
          - "$(DERIVED_FILE_DIR)/Generated/App-Info.plist"
          - "$(DERIVED_FILE_DIR)/Generated/agent-launchd.plist"

targets:
  FanCurve:
    type: application
    platform: macOS
    templates:
      - CommonConfig
    sources:
      - path: Sources/App
      - path: Sources/Models
      - path: Sources/Views
      - path: Sources/Services
      - path: Sources/Common
      - path: "${DERIVED_FILE_DIR}/Generated/Config.generated.swift"
        optional: true
        buildPhase: sources
        type: file
    dependencies:
      - package: FanCurve
        product: SMCFanKit
      - package: FanCurve
        product: AppLog
      - package: FanCurve
        product: SMCFanXPCClient
      - package: FanCurve
        product: SMCFanProtocol
      - package: Sparkle
        product: Sparkle
      - target: FanCurveAgent
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: FanCurve
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Generated/App-Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(CODE_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    postCompileScripts:
      - name: "Bundle agent into app"
        script: |
          set -euo pipefail
          AGENT_SRC="${BUILT_PRODUCTS_DIR}/${AGENT_BUNDLE_ID}"
          APP_DIR="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          AGENTS_DIR="${APP_DIR}/Contents/Library/LaunchAgents"
          MACOS_DIR="${APP_DIR}/Contents/MacOS"
          mkdir -p "${AGENTS_DIR}"
          cp "${AGENT_SRC}" "${MACOS_DIR}/"
          cp "${DERIVED_FILE_DIR}/Generated/agent-launchd.plist" \
             "${AGENTS_DIR}/${AGENT_BUNDLE_ID}.plist"

  FanCurveAgent:
    type: tool
    platform: macOS
    templates:
      - CommonConfig
    sources:
      - path: Sources/Agent
      - path: Sources/Models
      - path: Sources/Services/XPCClient.swift
      - path: Sources/Common
      - path: "${DERIVED_FILE_DIR}/Generated/Config.generated.swift"
        optional: true
        buildPhase: sources
        type: file
    dependencies:
      - package: FanCurve
        product: SMCFanKit
      - package: FanCurve
        product: AppLog
      - package: FanCurve
        product: SMCFanXPCClient
      - package: FanCurve
        product: SMCFanProtocol
    settings:
      base:
        PRODUCT_NAME: $(AGENT_BUNDLE_ID)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(CODE_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SKIP_INSTALL: YES
