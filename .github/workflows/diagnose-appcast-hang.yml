name: Diagnose Appcast Hang

# A probe, not a fix. It publishes nothing and touches no release, so it is safe to
# run while the appcast pipeline is broken. It runs on its own pull request so the
# evidence arrives without merging anything to main first.
on:
  workflow_dispatch:
    inputs:
      sparkle_version:
        description: Sparkle release whose binary artifact should be probed
        required: false
        default: "2.9.6"
        type: string
  pull_request:
    paths:
      - .github/workflows/diagnose-appcast-hang.yml
      - Scripts/diagnose-sparkle-download.sh

permissions:
  contents: read

env:
  XCODE_VERSION: "latest-stable"
  SPARKLE_VERSION: ${{ inputs.sparkle_version || '2.9.6' }}

jobs:
  # Each probe takes its own runner. A cold SwiftPM cache is the precondition for the
  # stall, so two probes sharing a runner would leave the second one warm and prove
  # nothing.
  probe:
    strategy:
      fail-fast: false
      matrix:
        probe:
          # Reach and SwiftPM on their own. Both already passed, and they stay as the
          # controls that keep the network and the artifact ruled out.
          - curl
          - default
          - nocreds
          # The pair that isolates the defect. `swiftpm` runs the exact command tuist
          # shells out to; `tuist` runs the command the appcast job reaches. They
          # differ by who invokes the resolve and by nothing else.
          - swiftpm
          - tuist
    name: probe (${{ matrix.probe }})
    runs-on: macos-latest
    # Each probe caps itself at three minutes against work that healthy takes twenty
    # seconds, so this only bounds a runner that never starts.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up the build environment
        if: ${{ matrix.probe == 'swiftpm' || matrix.probe == 'tuist' }}
        uses: agoodkind/swift-makefile/.github/actions/setup-build-env@main
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          github-token: ${{ github.token }}

      - name: Probe ${{ matrix.probe }}
        env:
          PROBE_NAME: ${{ matrix.probe }}
          DIAGNOSTICS_DIR: ${{ runner.temp }}/diagnostics-${{ matrix.probe }}
        run: Scripts/diagnose-sparkle-download.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ matrix.probe }}
          path: ${{ runner.temp }}/diagnostics-${{ matrix.probe }}
          if-no-files-found: error
