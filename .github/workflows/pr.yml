name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Cache Tuist artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.tuist
            Tuist/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved', '.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-derived-debug-${{ hashFiles('Sources/**', 'Tests/**', 'Project.swift', 'Workspace.swift', 'Tuist/Package.resolved', 'Config/**') }}
          restore-keys: |
            ${{ runner.os }}-derived-debug-

      - name: Install Tuist dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise install
          tuist install

      - name: Install lint tools
        run: brew install swiftlint

      - name: Write CI xcconfig (ad-hoc signing)
        run: |
          cat > Config/local.xcconfig <<'EOF'
          CODE_SIGN_IDENTITY = -
          DEVELOPMENT_TEAM =
          BUNDLE_ID_PREFIX = io.goodkind
          HELPER_BUNDLE_ID = io.goodkind.smcfanhelper
          APP_BUNDLE_ID = io.goodkind.fancurve
          AGENT_BUNDLE_ID = io.goodkind.fancurveagent
          SHARED_SUITE_ID = io.goodkind.fancurve.shared
          DMG_SIGN_IDENTITY = -
          SPARKLE_FEED_URL = https://example.invalid/fancurve/appcast.xml
          SPARKLE_PUBLIC_ED_KEY =
          EOF

      - name: Lint
        run: make lint

      - name: Test
        run: make test
