name: Deploy Appcast

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag whose appcast deployment should be retried
        required: true
        type: string
      release_track:
        description: Release track
        required: true
        type: choice
        options:
          - prerelease
          - stable

env:
  XCODE_VERSION: "latest-stable"
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy-appcast:
    runs-on: macos-latest
    # Longest successful run is 13 minutes, so this caps a stall without
    # threatening a slow release-history download.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: agoodkind/swift-makefile/.github/actions/setup-build-env@main
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Deploy appcast worker
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TRACK: ${{ inputs.release_track }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: "false"
        run: Scripts/deploy-appcast.sh

      - uses: actions/upload-artifact@v7
        with:
          name: appcast-${{ inputs.release_track }}
          path: build/sparkle-updates/appcast.xml
          if-no-files-found: error
