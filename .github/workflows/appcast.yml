name: Deploy Appcast

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag whose appcast deployment should be retried
        required: true
        type: string
      release_track:
        description: Release track
        required: true
        type: choice
        options:
          - prerelease
          - stable

env:
  XCODE_VERSION: "latest-stable"
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('appcast-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-appcast:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-latest' }}
    # Longest successful run is 13 minutes, so this caps a stall without
    # threatening a slow release-history download.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: agoodkind/swift-makefile/.github/actions/setup-build-env@main
        if: github.event_name == 'workflow_dispatch'
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Deploy appcast worker
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TRACK: ${{ inputs.release_track }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: "false"
        run: Scripts/deploy-appcast.sh

      - name: Validate appcast worker bundle
        if: github.event_name == 'pull_request'
        working-directory: deploy/appcast-worker
        run: |
          npm install --no-save --package-lock=false wrangler@4.123.0
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.toml

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: appcast-${{ inputs.release_track }}
          path: build/sparkle-updates/appcast.xml
          if-no-files-found: error
