name: Deploy Appcast

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to redeploy appcast from
        required: true
        type: string

jobs:
  deploy-appcast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            deploy/appcast-worker

      - name: Download appcast asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --pattern appcast.xml --dir release-assets

      - name: Stage appcast asset
        run: cp release-assets/appcast.xml deploy/appcast-worker/public/appcast.xml

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Deploy appcast worker
        working-directory: deploy/appcast-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
