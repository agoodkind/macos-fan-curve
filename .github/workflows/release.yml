name: Release

on:
  push:
    branches:
      - main
    paths:
      - Sources/**
      - Tests/**
      - Project.swift
      - Workspace.swift
      - Tuist.swift
      - Tuist/**
      - Config/**
      - Scripts/**
      - Templates/**
      - Makefile
      - .tool-versions
      - .github/workflows/release.yml
      - .github/actions/setup-build-env/action.yml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  XCODE_VERSION: "latest-stable"
  APPLE_TEAM_ID: H3BMXM4W7H
  APPLE_CODE_SIGN_IDENTITY: "Developer ID Application: Alex Goodkind (H3BMXM4W7H)"
  APPLE_NOTARY_KEY_ID: JHC8GR65Q3
  # The swift-makefile bootstrap fetches swift.mk via `gh api` on every make
  # invocation; without a token gh fails and the fetch silently writes an empty
  # swift.mk, so the build target never loads. Authenticate the public fetch.
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      build_version: ${{ steps.meta.outputs.build_version }}
      marketing_version: ${{ steps.meta.outputs.marketing_version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out helper repo
        uses: actions/checkout@v6
        with:
          repository: agoodkind/macos-smc-fan
          ref: 4f942a36f6b63c5b0951a3937f8bf2dcbc85446d
          path: .ci/macos-smc-fan

      - uses: ./.github/actions/setup-build-env
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          github-token: ${{ github.token }}

      - name: Install Tuist dependencies
        run: make install-dependencies

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          timestamp_utc="$(date -u +%Y%m%d%H%M)"
          hex_run_number="$(printf '%x' "$GITHUB_RUN_NUMBER")"
          short_sha="$(git rev-parse --short HEAD)"
          build_version="${timestamp_utc}${GITHUB_RUN_NUMBER}"
          tag="${timestamp_utc}-${hex_run_number}-${short_sha}"
          marketing_version="$(date -u +%y.%-m.%-d)"

          if [[ "${#build_version}" -gt 18 ]]; then
              echo "CURRENT_PROJECT_VERSION exceeds Apple's 18-character CFBundleVersion limit: ${build_version}" >&2
              exit 1
          fi

          {
              printf 'tag=%s\n' "$tag"
              printf 'build_version=%s\n' "$build_version"
              printf 'marketing_version=%s\n' "$marketing_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install signing certificate
        id: signing_cert
        uses: agoodkind/swift-makefile/.github/actions/import-signing-cert@main
        with:
          p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          identity-name: ${{ env.APPLE_CODE_SIGN_IDENTITY }}

      - name: Write CI xcconfig
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ steps.signing_cert.outputs.identity-sha1 }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > Config/local.xcconfig <<EOF
          CODE_SIGN_IDENTITY = ${CODE_SIGN_IDENTITY}
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          BUNDLE_ID_PREFIX = io.goodkind
          HELPER_BUNDLE_ID = io.goodkind.smcfanhelper
          APP_BUNDLE_ID = io.goodkind.fancurve
          AGENT_BUNDLE_ID = io.goodkind.fancurveagent
          SHARED_SUITE_ID = io.goodkind.fancurve.shared
          DMG_SIGN_IDENTITY = ${CODE_SIGN_IDENTITY}
          SPARKLE_FEED_URL = https://goodkind.io/fancurve/appcast.xml
          SPARKLE_PUBLIC_ED_KEY = ${SPARKLE_PUBLIC_ED_KEY}
          EOF

      - name: Write helper CI xcconfig
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ steps.signing_cert.outputs.identity-sha1 }}
        shell: bash
        run: |
          set -euo pipefail

          cat > .ci/macos-smc-fan/Config/local.xcconfig <<EOF
          CODE_SIGN_IDENTITY = ${CODE_SIGN_IDENTITY}
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          BUNDLE_ID_PREFIX = io.goodkind
          HELPER_BUNDLE_ID = io.goodkind.smcfanhelper
          APP_BUNDLE_ID = io.goodkind.fancurve
          HELPER_APP_DISPLAY_NAME = Fan Curve Hardware Helper
          HELPER_DAEMON_DISPLAY_NAME = Fan Curve Hardware Helper
          EOF

      - name: Build release DMG
        env:
          MARKETING_VERSION: ${{ steps.meta.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.meta.outputs.build_version }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          make release-assets \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            SPARKLE_FEED_URL="https://goodkind.io/fancurve/appcast.xml" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            HELPER_REPO="${{ github.workspace }}/.ci/macos-smc-fan"

      - name: Generate app SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: Products/Fan Curve.app
          syft-version: v1.44.0
          format: spdx-json
          output-file: Products/FanCurve-${{ steps.meta.outputs.build_version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v7
        with:
          name: release-sbom-${{ steps.meta.outputs.tag }}
          path: Products/FanCurve-${{ steps.meta.outputs.build_version }}.spdx.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-dmg-${{ steps.meta.outputs.tag }}
          path: Products/FanCurve-${{ steps.meta.outputs.build_version }}.dmg
          if-no-files-found: error

  notarize:
    runs-on: macos-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          github-token: ${{ github.token }}

      - name: Install Tuist dependencies
        run: make install-dependencies

      - uses: actions/download-artifact@v8
        with:
          name: release-dmg-${{ needs.build.outputs.tag }}
          path: Products

      - uses: actions/download-artifact@v8
        with:
          name: release-sbom-${{ needs.build.outputs.tag }}
          path: Products

      - name: Notarize and staple DMG
        uses: agoodkind/swift-makefile/.github/actions/notarize-staple@main
        with:
          artifact-path: Products/FanCurve-${{ needs.build.outputs.build_version }}.dmg
          notary-key-base64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          notary-key-id: ${{ env.APPLE_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      - name: Attest stapled DMG provenance
        uses: actions/attest@v4.1.0
        with:
          subject-path: Products/FanCurve-${{ needs.build.outputs.build_version }}.dmg

      - name: Attest stapled DMG SBOM
        uses: actions/attest@v4.1.0
        with:
          subject-path: Products/FanCurve-${{ needs.build.outputs.build_version }}.dmg
          sbom-path: Products/FanCurve-${{ needs.build.outputs.build_version }}.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-dmg-stapled-${{ needs.build.outputs.tag }}
          path: Products/FanCurve-${{ needs.build.outputs.build_version }}.dmg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - notarize
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-dmg-stapled-${{ needs.build.outputs.tag }}
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: release-sbom-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Push release tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.build.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.build.outputs.tag }}"

      - name: Create GitHub release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          BUILD_VERSION: ${{ needs.build.outputs.build_version }}
        run: |
          gh release create "$TAG" \
            "release-assets/FanCurve-${BUILD_VERSION}.dmg" \
            "release-assets/FanCurve-${BUILD_VERSION}.spdx.json" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Automated release for $GITHUB_SHA"
