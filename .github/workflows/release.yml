name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Project.swift'
      - 'Workspace.swift'
      - 'Tuist.swift'
      - 'Tuist/**'
      - 'Config/**'
      - 'Scripts/**'
      - 'Templates/**'
      - 'Makefile'
      - '.tool-versions'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    env:
      APPLE_TEAM_ID: H3BMXM4W7H
      APPLE_CODE_SIGN_IDENTITY: "Developer ID Application: Alex Goodkind (H3BMXM4W7H)"
      APPLE_NOTARY_KEY_ID: JHC8GR65Q3

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Cache Tuist artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.tuist
            Tuist/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved', '.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-derived-release-${{ hashFiles('Sources/**', 'Project.swift', 'Workspace.swift', 'Tuist/Package.resolved', 'Config/**') }}
          restore-keys: |
            ${{ runner.os }}-derived-release-

      - name: Install Tuist dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise install
          tuist install

      - name: Compute release metadata
        id: meta
        run: |
          TS=$(date -u +%Y%m%d%H%M)
          HEX=$(printf '%x' "$GITHUB_RUN_NUMBER")
          SHA=$(git rev-parse --short HEAD)
          BUILD_VERSION="${TS}${GITHUB_RUN_NUMBER}"
          TAG="${TS}-${HEX}-${SHA}"
          SHORT_VERSION=$(date -u +%y.%-m.%-d)
          if [ "${#BUILD_VERSION}" -gt 18 ]; then
            echo "CURRENT_PROJECT_VERSION exceeds Apple's 18-character CFBundleVersion limit: $BUILD_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$SHORT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node for Wrangler
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          BUILD_CERTIFICATE_BASE64_PART1: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64_PART1 }}
          BUILD_CERTIFICATE_BASE64_PART2: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64_PART2 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_CODE_SIGN_IDENTITY: ${{ env.APPLE_CODE_SIGN_IDENTITY }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          export CERT_PATH
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$P12_PASSWORD}"

          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          elif [ -n "$BUILD_CERTIFICATE_BASE64_PART1$BUILD_CERTIFICATE_BASE64_PART2" ]; then
            printf '%s%s' "$BUILD_CERTIFICATE_BASE64_PART1" "$BUILD_CERTIFICATE_BASE64_PART2" | base64 --decode > "$CERT_PATH"
          else
            echo "No signing cert secret was provided (APPLE_DEVELOPER_ID_P12_BASE64 or PART1+PART2)" >&2
            exit 1
          fi

          ls -l "$CERT_PATH"
          file "$CERT_PATH"
          openssl pkcs12 -in "$CERT_PATH" -nokeys -passin pass:"$P12_PASSWORD" >/dev/null

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          DEVELOPER_ID_SIGN_IDENTITY_SHA1="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -v identity="\"$APPLE_CODE_SIGN_IDENTITY\"" 'index($0, identity) { print $2; exit }')"
          if [ -z "$DEVELOPER_ID_SIGN_IDENTITY_SHA1" ]; then
            echo "Developer ID Application signing identity was not found in imported keychain" >&2
            exit 1
          fi
          echo "DEVELOPER_ID_SIGN_IDENTITY_SHA1=$DEVELOPER_ID_SIGN_IDENTITY_SHA1" >> "$GITHUB_ENV"
          echo "DMG_SIGN_IDENTITY=$DEVELOPER_ID_SIGN_IDENTITY_SHA1" >> "$GITHUB_ENV"

      - name: Write CI xcconfig
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ env.DEVELOPER_ID_SIGN_IDENTITY_SHA1 }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          cat > Config/local.xcconfig <<EOF
          CODE_SIGN_IDENTITY = ${CODE_SIGN_IDENTITY}
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          BUNDLE_ID_PREFIX = io.goodkind
          HELPER_BUNDLE_ID = io.goodkind.smcfanhelper
          APP_BUNDLE_ID = io.goodkind.fancurve
          AGENT_BUNDLE_ID = io.goodkind.fancurveagent
          SHARED_SUITE_ID = io.goodkind.fancurve.shared
          DMG_SIGN_IDENTITY = ${CODE_SIGN_IDENTITY}
          SPARKLE_FEED_URL = https://goodkind.io/fancurve/appcast.xml
          SPARKLE_PUBLIC_ED_KEY = ${SPARKLE_PUBLIC_ED_KEY}
          EOF

      - name: Build release DMG
        env:
          MARKETING_VERSION: ${{ steps.meta.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.meta.outputs.build_version }}
        run: |
          make release-assets \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            SPARKLE_FEED_URL="https://goodkind.io/fancurve/appcast.xml" \
            SPARKLE_PUBLIC_ED_KEY="${{ secrets.SPARKLE_PUBLIC_ED_KEY }}"

      - name: Notarize DMG
        id: notarize
        env:
          APPLE_NOTARY_KEY_ID: ${{ env.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          NOTARY_OUTPUT="$RUNNER_TEMP/notarytool-submit.json"
          NOTARY_LOG="$RUNNER_TEMP/notarytool.log"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          set +e
          xcrun notarytool submit "Products/FanCurve-${BUILD_VERSION}.dmg" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$NOTARY_OUTPUT"
          NOTARY_STATUS=$?
          set -e
          cat "$NOTARY_OUTPUT"
          SUBMISSION_ID="$(plutil -extract id raw -o - "$NOTARY_OUTPUT" 2>/dev/null || true)"
          SUBMISSION_STATUS="$(plutil -extract status raw -o - "$NOTARY_OUTPUT" 2>/dev/null || true)"
          if [ -n "$SUBMISSION_ID" ]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              "$NOTARY_LOG" || true
            cat "$NOTARY_LOG" || true
          fi
          if [ "$NOTARY_STATUS" -ne 0 ] || [ "$SUBMISSION_STATUS" != "Accepted" ]; then
            exit 1
          fi
          xcrun stapler staple "Products/FanCurve-${BUILD_VERSION}.dmg"

      - name: Upload notarytool diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarytool-diagnostics
          path: |
            ${{ runner.temp }}/notarytool-submit.json
            ${{ runner.temp }}/notarytool.log
          if-no-files-found: ignore

      - name: Generate Sparkle appcast
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
          MARKETING_VERSION: ${{ steps.meta.outputs.marketing_version }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/sparkle_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_PATH"
          export SPARKLE_PRIVATE_KEY_FILE="$KEY_PATH"

          make prepare-sparkle-updates \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_VERSION" \
            RELEASE_TAG="$RELEASE_TAG" \
            GITHUB_RELEASE_BASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/"

      - name: Push tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Automated release for $GITHUB_SHA"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
        run: |
          gh release upload "$TAG" \
            "Products/FanCurve-${BUILD_VERSION}.dmg" \
            "build/sparkle-updates/appcast.xml" \
            --clobber
