name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_track:
        description: Release track
        required: false
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      candidate_tag:
        description: Published pre-release tag to promote
        required: false
        type: string
      source_sha:
        description: Emergency source commit
        required: false
        type: string
      allow_source_sha:
        description: Acknowledge an emergency source commit
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

# The caller must grant every permission the called workflow's jobs request.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: agoodkind/swift-makefile/.github/workflows/_release.yml@main
    with:
      runner: macos-26
      release-track: ${{ github.event_name == 'workflow_dispatch' && inputs.release_track || '' }}
      release-on-merge: stable
      candidate-tag: ${{ inputs.candidate_tag || '' }}
      candidate-asset-pattern: "FanCurve-*.dmg"
      source-sha: ${{ inputs.source_sha || '' }}
      allow-source-sha: ${{ inputs.allow_source_sha || false }}
      signing-identity-name: ${{ vars.APPLE_DEVELOPER_ID_IDENTITY }}
      apple-team-id: ${{ vars.APPLE_TEAM_ID }}
      notarize-pattern: "*.dmg"
      sbom-subject-path: "Products/Fan Curve.app"
      smoke-asset: "FanCurve-__ARTIFACT_VERSION__.dmg"
      smoke-binary: "FanCurve"
      post-publish-timeout-minutes: 15
      post-publish-node-version: "22"
      post-publish-command: >-
        SPARKLE_PRIVATE_KEY="${POST_PUBLISH_SECRET_1}"
        CLOUDFLARE_API_TOKEN="${POST_PUBLISH_SECRET_2}"
        CLOUDFLARE_ACCOUNT_ID="${POST_PUBLISH_SECRET_3}"
        DRY_RUN=false
        Scripts/deploy-appcast.sh
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      LOCAL_POOL_CAPACITY_TOKEN: ${{ secrets.LOCAL_POOL_CAPACITY_TOKEN }}
      POST_PUBLISH_SECRET_1: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
      POST_PUBLISH_SECRET_2: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POST_PUBLISH_SECRET_3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
