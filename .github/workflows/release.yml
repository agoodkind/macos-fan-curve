name: Release

on:
  push:
    branches:
      - main
  # A pull request runs the whole signed pipeline and stops before publishing, so
  # a change that breaks signing, notarization, packaging, or the appcast fails
  # here instead of on main. Without it the first thing to exercise the release
  # path is the merge itself, and a broken release is found only once it cannot be
  # undone.
  pull_request:
  workflow_dispatch:
    inputs:
      release_track:
        description: Release track
        required: false
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      candidate_tag:
        description: Published pre-release tag to promote
        required: false
        type: string
      source_sha:
        description: Emergency source commit
        required: false
        type: string
      allow_source_sha:
        description: Acknowledge an emergency source commit
        required: true
        default: false
        type: boolean

# One group per ref. A new pull request push cancels its own superseded dry run,
# while a push to main is a real release and never cancels an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The caller must grant every permission the called workflow's jobs request.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    # A fork pull request cannot read this repository's signing secrets, so the
    # signed run would fail for a reason the contributor cannot fix. Dependabot
    # branches live in this repository and pass that check, but a Dependabot pull
    # request reads its own secret store rather than the Actions one, so the shared
    # workflow's signed dry run would exit on missing credentials every time.
    if: >-
      ${{ github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]') }}
    uses: agoodkind/swift-makefile/.github/workflows/_release.yml@main
    with:
      runner: macos-26
      ephemeral: ${{ github.event_name == 'pull_request' }}
      release-track: ${{ github.event_name == 'workflow_dispatch' && inputs.release_track || '' }}
      release-on-merge: stable
      candidate-tag: ${{ inputs.candidate_tag || '' }}
      candidate-asset-pattern: "FanCurve-*.dmg"
      source-sha: ${{ inputs.source_sha || '' }}
      allow-source-sha: ${{ inputs.allow_source_sha || false }}
      signing-identity-name: "Developer ID Application: Alex Goodkind (H3BMXM4W7H)"
      apple-team-id: H3BMXM4W7H
      notarize-pattern: "*.dmg"
      sbom-subject-path: "Products/Fan Curve.app"
    secrets: inherit

  appcast:
    needs: release
    uses: ./.github/workflows/appcast.yml
    with:
      release_tag: ${{ needs.release.outputs['release-tag'] }}
      release_track: ${{ needs.release.outputs['release-track'] }}
      # The dry run generates, signs, and stages the appcast exactly as a real
      # release does, and only the worker publish is held back. Skipping the whole
      # job instead would leave appcast generation unexercised until a merge, which
      # is the failure this pull request run exists to catch.
      dry_run: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
