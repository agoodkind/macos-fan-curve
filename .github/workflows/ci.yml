name: CI

on:
  pull_request:
    branches:
      - main
  # Build on merges to main so the branch-scoped compile cache is populated on the
  # default branch. A pull request reads only its own branch's cache and main's, so
  # without a main build every pull request starts from a cold cache.
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # The caller job id is the middle segment of every reusable-workflow status
  # check name (`CI / swift / build`).
  swift:
    uses: agoodkind/swift-makefile/.github/workflows/_ci.yml@main
    with:
      # Pool-routing validation probe: route this run's heavy gates to the M1
      # pool so we can measure a consumer's queued time on the pool vs hosted.
      # This mirrors the default that _ci.yml carries after swift-makefile #75.
      local-pool-capacity-url: https://darwin-gh-broker.silver-flare.com/capacity
      setup-target: install-dependencies
      import-signing-cert: true
      signing-identity-name: "Developer ID Application: Alex Goodkind (H3BMXM4W7H)"
      apple-team-id: H3BMXM4W7H
    secrets: inherit
